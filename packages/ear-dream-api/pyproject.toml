[project]
name = "ear-dream-api"
version = "0.1.0"
description = "Ear Dream - 한손 수어 인식 실시간 통역 서비스 API (MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.28.1",
    "kiwipiepy>=0.23.2",
    "numpy>=2.5.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]
extract = [
    "mediapipe>=0.10,<1.0",
    "opencv-python>=5.0.0.93",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
